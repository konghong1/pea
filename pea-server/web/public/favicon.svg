<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- App icon background -->
  <rect width="512" height="512" rx="120" fill="url(#greenGrad)" filter="url(#shadow)"/>
  
  <!-- Pea pod shape -->
  <ellipse cx="256" cy="280" rx="180" ry="120" fill="#22c55e"/>
  
  <!-- Three peas representing media types -->
  <circle cx="180" cy="260" r="50" fill="#86efac"/>
  <circle cx="256" cy="240" r="50" fill="#86efac"/>
  <circle cx="332" cy="260" r="50" fill="#86efac"/>
  
  <!-- Pea highlights -->
  <circle cx="165" cy="245" r="15" fill="#bbf7d0"/>
  <circle cx="241" cy="225" r="15" fill="#bbf7d0"/>
  <circle cx="317" cy="245" r="15" fill="#bbf7d0"/>
  
  <!-- Play icon in center pea -->
  <polygon points="246,230 246,270 276,250" fill="#16a34a"/>
</svg>
