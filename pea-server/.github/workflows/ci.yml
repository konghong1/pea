# ⚠️ 已失效（DEPRECATED）：本文件不在 git 仓库根目录，GitHub Actions 不会读取它。
# 本仓库 git 根是 pea/，Actions 只识别 pea/.github/workflows/ 下的 workflow。
# 生效版本已迁移至：<repo-root>/.github/workflows/ci.yml
#   （working-directory 已修正为 pea-server/ 前缀，并新增 web 前端单测 job）
# 保留本文件仅作历史参考，请勿在此处修改 CI 配置。

name: pea CI (DEPRECATED - 见仓库根 .github/workflows/ci.yml)

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  bff:
    name: BFF (NestJS) 构建 + 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install
      - name: 类型检查 / 构建 (nest build)
        run: npm run build
      - name: 单元测试 (jest)
        run: npm test

  orchestrator:
    name: Generation Orchestrator (FastAPI) 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/generation-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 单元测试 (pytest)
        run: python -m pytest
