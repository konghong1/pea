# pea Creative OS — 本地一键环境 (E0 / T-INFRA-01)
# 启动: docker compose up --build   (首次会自动建表 + 初始化 bucket)
# 访问: http://localhost:8088  (Web), BFF :4100, Orchestrator :8000
# 注意: 宿主机 8080/4000 常被其他进程占用, 已改到 8088/4100 (容器内仍是 80/4000, web 经内网 bff:4000 不受影响)

name: pea-server   # 固定 project name, 避免生成 2b4ce94e001f_* 这类哈希前缀孤儿容器导致冲突

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_DATABASE: pea
      MYSQL_USER: ${PEA_DB_USER:-pea}
      MYSQL_PASSWORD: ${PEA_DB_PASSWORD:-pea_dev}
      MYSQL_ROOT_PASSWORD: ${PEA_DB_ROOT_PASSWORD:-pea_root}
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机可访问; 容器间仍走 docker 内网 mysql:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upaea", "-ppea_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机可访问; 容器间仍走 docker 内网 redis:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PEA_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PEA_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # 仅本机; 媒体经 web 容器 /media 代理对外, 无需公网暴露
      - "127.0.0.1:9001:9001"   # MinIO 控制台仅本机; 运维走 ssh 隧道访问
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 启动期 DDL 漂移自检 (T-OBS-04): 在 bff/orchestrator 之前幂等修正 schema,
  # 防止 named volume 不重跑 initdb.d 导致的注册 500 等隐性故障。
  dbmigrate:
    image: mysql:8.0
    command: ["bash", "/migrate/assert-migrated.sh"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${PEA_DB_ROOT_PASSWORD:-pea_root}
      DB_NAME: pea
    volumes:
      - ./infra/mysql/assert-migrated.sh:/migrate/assert-migrated.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  bff:
    build:
      context: .
      dockerfile: infra/docker/bff.Dockerfile
    environment:
      PEA_PORT: "4000"
      PEA_JWT_SECRET: "${PEA_JWT_SECRET:-dev-secret-change-me}"
      PEA_DB_HOST: mysql
      PEA_DB_PORT: "3306"
      PEA_DB_USER: ${PEA_DB_USER:-pea}
      PEA_DB_PASSWORD: ${PEA_DB_PASSWORD:-pea_dev}
      PEA_DB_NAME: pea
      PEA_REDIS_URL: "redis://redis:6379/0"
      PEA_MINIO_ENDPOINT: "minio:9000"
      PEA_MINIO_ACCESS_KEY: ${PEA_MINIO_ACCESS_KEY:-minioadmin}
      PEA_MINIO_SECRET_KEY: ${PEA_MINIO_SECRET_KEY:-minioadmin}
      PEA_MINIO_USE_SSL: "false"
      PEA_MINIO_BUCKET: pea-media
      PEA_MINIO_PUBLIC_ENDPOINT: "localhost:9000"
      # 前端展示/内部落库使用的基址：相对路径 /media 走本站 nginx -> MinIO，
      # 避免花生壳等内网穿透域名在浏览器端证书/解析异常导致裂图。
      PEA_CDN_BASE_URL: "/media"
      # 外部模型（Agnes）下载参考图需要的公网可达地址；必须保留 /media 前缀，
      # 因为 nginx 把 /media/ 反代到 MinIO，丢前缀会落到 SPA 回退 404。
      PEA_EXTERNAL_REF_BASE_URL: "https://720lp31wa108.vicp.fun/media"
      PEA_ORCHESTRATOR_URL: "http://generation-orchestrator:8000"
      PEA_INTERNAL_SERVICE_TOKEN: "dev-token"
      PEA_FREE_TAPIES: "1000"
      # 管理员账户: BFF 启动时把该账户密码幂等同步为下面的值 (bcrypt 入库)。
      # 改密码只需改 PEA_ADMIN_PASSWORD 后 docker compose up -d bff 重启即可。
      PEA_ADMIN_EMAIL: "admin@pea.ai"
      PEA_ADMIN_PASSWORD: "${PEA_ADMIN_PASSWORD:-admin12345}"
      # AI 网关兜底: 仅当显式配置 PEA_AI_GATEWAY 时启用(官方 base_url 不可达时回退到该地址)。
      # ★ 默认空 = 不兜底。切勿默认指向 host.docker.internal:33210 —— 那是开发机专属代理,
      #   服务器上没有, 会把真实错误掩盖成 "ECONNREFUSED 172.17.0.1:33210"。
      PEA_AI_GATEWAY: "${PEA_AI_GATEWAY:-}"
    # 外部 AI 域名(apihub 等) DNS: 默认走宿主 DNS; 若宿主 DNS 被污染导致拉取/出图失败,
    # 由 .env 的 PEA_DNS_FIX=1 叠加 docker-compose.dns-override.yml 使用干净公共 DNS(见该文件注释)。
    ports:
      - "4100:4000"   # 宿主机 4000 被 WorkBuddy 自带 node 占用, 改用 4100 映射到容器内 4000; web 走内网 bff:4000 不受影响
    # 让容器内可用 host.docker.internal 访问宿主上的服务(如 33210 AI 网关)。
    # 关键修复: 用户配的 AI 网关在 172.17.0.1:33210, 那是 docker0 网关, 仅默认网桥容器可达;
    # bff 在 compose 用户网桥上不可路由 -> ECONNREFUSED。改用 host.docker.internal 经 host-gateway 访问宿主。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 容器内使用干净公共 DNS, 确保能解析外部 AI 域名(apihub.agnes-ai.com 等)以直连官方 base_url 拉模型/出图。
    # 内网服务名(mysql/minio/bff)由 docker 内置 DNS(127.0.0.11)优先解析, 不受此影响。
    dns:
      - "223.5.5.5"
      - "119.29.29.29"
    depends_on:
      dbmigrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  generation-orchestrator:
    build:
      context: .
      dockerfile: infra/docker/orchestrator.Dockerfile
    environment:
      PEA_DB_HOST: mysql
      PEA_DB_PORT: "3306"
      PEA_DB_USER: ${PEA_DB_USER:-pea}
      PEA_DB_PASSWORD: ${PEA_DB_PASSWORD:-pea_dev}
      PEA_DB_NAME: pea
      PEA_REDIS_URL: "redis://redis:6379/0"
      PEA_MINIO_ENDPOINT: "minio:9000"
      PEA_MINIO_ACCESS_KEY: ${PEA_MINIO_ACCESS_KEY:-minioadmin}
      PEA_MINIO_SECRET_KEY: ${PEA_MINIO_SECRET_KEY:-minioadmin}
      PEA_MINIO_BUCKET: pea-media
      # 前端展示/内部落库走相对路径 /media（本站 nginx -> MinIO），避免浏览器端裂图。
      PEA_CDN_BASE_URL: "/media"
      # 视频参考图等需要外部模型（Agnes）下载的地址：花生壳公网域名，必须带 /media 前缀。
      PEA_EXTERNAL_REF_BASE_URL: "https://720lp31wa108.vicp.fun/media"
      PEA_BFF_INTERNAL_BASE_URL: "http://bff:4000"
      PEA_INTERNAL_SERVICE_TOKEN: "dev-token"
      PEA_WORKER_ENABLED: "true"
      # 生产环境：真实调用失败直接置 FAILED + 自动退款，绝不静默回退 Mock 假图。
      # allow_mock_fallback 仅离线联调用；线上=true 会把任何故障伪装成占位 SVG，掩盖真实错误。
      # 图片生成超时 300s：Agnes 图像模型实测 18~77s 且波动大，留足余量避免误判超时（须 < worker 硬超时）。
      PEA_ALLOW_MOCK_FALLBACK: "false"
      # 2026-07-28 调整: 晚高峰实测 submit 阶段可达 5-10 分钟, 原 300s 频繁误杀
      # 失败. 放宽到 900s (15min) 覆盖峰值, 同时仍受外部 nginx 进一步超时约束.
      PEA_PROVIDER_IMAGE_TIMEOUT_S: "900"
      PEA_PROVIDER_VIDEO_SUBMIT_TIMEOUT_S: "900"
      PEA_PROVIDER_HTTP_CONNECT_TIMEOUT_S: "15"
      # AI 网关兜底: 仅当显式配置 PEA_AI_GATEWAY 时启用(默认空=不兜底, 理由同 bff)。
      PEA_AI_GATEWAY: "${PEA_AI_GATEWAY:-}"
      # 真实模型出图：不走 mock。图像/视频直接透传提供商公网 CDN URL，浏览器直显。
      # （之前 PEA_FORCE_MOCK_TYPES=image,video 仅用于联调占位，已移除——用户要求调用真实模型。）
    # 外部 AI 域名 DNS: 默认走宿主 DNS; 若被污染, 由 PEA_DNS_FIX=1 叠加 dns-override.yml 修复
    ports:
      - "8000:8000"
    # 同 bff: 允许经 host.docker.internal 访问宿主侧 AI 网关(33210 等)。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 容器内使用干净公共 DNS, 确保能解析外部 AI 域名(apihub.agnes-ai.com 等)以直连官方 base_url 拉模型/出图。
    # 内网服务名(mysql/minio/bff)由 docker 内置 DNS(127.0.0.11)优先解析, 不受此影响。
    dns:
      - "223.5.5.5"
      - "119.29.29.29"
    depends_on:
      dbmigrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8088:80"   # 临时: 宿主机 8080 被其他进程(PID 6992)占用, 改用 8088; 释放 8080 后改回 8080
    depends_on:
      - bff

volumes:
  mysql_data:
  minio_data:
