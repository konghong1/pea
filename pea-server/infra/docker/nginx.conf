server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 BFF (与 web/vite.config.ts 代理前缀保持一致;
    # 漏掉 admin/models/plans 会导致这些路由落到 SPA 回退返回 index.html,
    # 前端 .map 非数组 -> 整树崩溃白屏)
    location ~ ^/(auth|users|billing|generation|files|canvases|providers|works|internal|shared|admin|models|plans) {
        proxy_pass http://bff:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 实时推送
    location /ws {
        proxy_pass http://bff:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
