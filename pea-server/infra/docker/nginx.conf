server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许大文件上传（头像/原图/替换图）。默认 1m 会导致 /files/upload 触发
    # "413 Request Entity Too Large"。与 BFF 的 multer fileSize 上限(100MB)对齐。
    client_max_body_size 100m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 BFF (与 web/vite.config.ts 代理前缀保持一致;
    # 漏掉 admin/models/plans 会导致这些路由落到 SPA 回退返回 index.html,
    # 前端 .map 非数组 -> 整树崩溃白屏)
    location ~ ^/(auth|users|billing|generation|files|canvases|providers|works|internal|shared|admin|models|plans|chat|platform-configs|usage) {
        proxy_pass http://bff:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 不被缓冲 (节点聊天流式回填)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 实时推送
    location /ws {
        proxy_pass http://bff:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
