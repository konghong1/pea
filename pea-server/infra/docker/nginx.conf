server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许大文件上传（头像/原图/替换图）。默认 1m 会导致 /files/upload 触发
    # "413 Request Entity Too Large"。与 BFF 的 multer fileSize 上限(100MB)对齐。
    client_max_body_size 100m;

    # SPA 路由回退：index.html 永不缓存，确保每次强刷/重进都能拿到最新 JS/CSS 引用。
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长期缓存（immutable）。
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 生成结果媒体代理: 把 /media/<key> 转发到 MinIO 桶 pea-media/<key> (同域, 规避
    # localhost:9000 跨主机失效 + CORS; gen/ 前缀匿名读策略由编排器启动时设置)。
    # 外层用相对 PEA_CDN_BASE_URL=/media, 故图片 URL 始终与页面同源, 任意访问方式均可加载。
    location /media/ {
        proxy_pass http://minio:9000/pea-media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反向代理到 BFF (与 web/vite.config.ts 代理前缀保持一致;
    # 漏掉 admin/models/plans/assets 会导致这些路由落到 SPA 回退返回 index.html,
    # 前端 .map 非数组 -> 整树崩溃白屏)
    location ~ ^/(auth|users|billing|generation|files|canvases|assets|providers|works|internal|shared|admin|models|plans|chat|platform-configs|usage) {
        proxy_pass http://bff:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 不被缓冲 (节点聊天流式回填)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 实时推送
    location /ws {
        proxy_pass http://bff:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
