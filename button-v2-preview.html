<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>pea · 简洁版生成按钮</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0b0f;
    color: #E8F4FF;
    font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
    padding: 40px 24px;
    min-height: 100vh;
  }
  .page { max-width: 800px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #BFE9FF 0%, #6BC8FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { font-size: 12px; color: rgba(232,244,255,0.5); margin-bottom: 32px; }
  .section { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; margin: 28px 0 12px; }

  /* ===== 简洁版生成按钮 ===== */
  .pe-launcher {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 8px 0 10px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(40, 50, 70, 0.9) 0%, rgba(20, 26, 38, 0.95) 100%);
    border: 1px solid rgba(125, 221, 255, 0.2);
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(63, 169, 245, 0.12),
      0 4px 12px -2px rgba(30, 141, 239, 0.35),
      0 2px 6px -1px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    transition:
      transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 0.2s ease;
  }
  .pe-launcher:hover {
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 -1px 0 rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(125, 221, 255, 0.35),
      0 6px 16px -2px rgba(30, 141, 239, 0.5),
      0 2px 8px -1px rgba(0, 0, 0, 0.6);
  }
  .pe-launcher:active {
    transform: translateY(0) scale(0.98);
  }

  /* 消耗文字 */
  .pe-cost {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding-right: 8px;
    border-right: 1px solid rgba(125, 221, 255, 0.15);
    margin-right: 4px;
  }
  .pe-cost-icon {
    width: 12px;
    height: 12px;
    opacity: 0.9;
  }
  .pe-cost-num {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: -0.2px;
  }
  .pe-cost-lbl {
    font-size: 9px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* 发射按钮 */
  .pe-trigger {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8EDBFF 0%, #2A9BFF 60%, #1A7FE8 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.4),
      inset 0 -1px 2px rgba(10, 74, 176, 0.6),
      0 0 0 1px rgba(125, 221, 255, 0.3),
      0 2px 6px rgba(30, 141, 239, 0.5);
    transition:
      transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 0.2s ease;
  }
  .pe-launcher:hover .pe-trigger {
    transform: scale(1.08);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 0 -1px 2px rgba(10, 74, 176, 0.6),
      0 0 0 1px rgba(191, 233, 255, 0.5),
      0 3px 10px rgba(30, 141, 239, 0.7);
  }
  .pe-trigger:active {
    transform: scale(0.95);
  }

  /* 播放/发射图标 */
  .pe-rocket {
    width: 10px;
    height: 10px;
    transform: rotate(-45deg);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
  }

  /* 状态变体 */
  .pe-launcher.disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }
  .pe-launcher.disabled .pe-trigger {
    background: radial-gradient(circle at 35% 30%, #666 0%, #444 60%, #222 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 1px 3px rgba(0,0,0,0.3);
  }
  .pe-launcher.submitting .pe-trigger {
    background: radial-gradient(circle at 35% 30%, #8EDBFF 0%, #2A9BFF 60%, #1A7FE8 100%);
    animation: pe-breath 1.2s ease-in-out infinite;
  }
  @keyframes pe-breath {
    0%, 100% { box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 0 0 1px rgba(125,221,255,0.3), 0 2px 6px rgba(30,141,239,0.5); }
    50%      { box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 0 0 1px rgba(191,233,255,0.6), 0 3px 10px rgba(30,141,239,0.7); }
  }

  /* 展示区 */
  .stage {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stage-label { font-size: 10px; color: rgba(255,255,255,0.35); position: absolute; top: 8px; left: 10px; }
  .stage-cell { position: relative; }

  /* 对比 */
  .compare { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .compare-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .compare-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="page">
  <h1>pea · 简洁版生成按钮</h1>
  <p class="subtitle">紧凑 · 精致 · 适配系统</p>

  <div class="section">对比: 旧版(大) vs 新版(紧凑)</div>
  <div class="stage" style="margin-bottom: 20px;">
    <div class="compare-item">
      <span class="compare-label">旧版 (44px)</span>
      <div class="pe-launcher" style="height:44px; padding:4px 4px 4px 14px; border-radius:26px;">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M6 9 L12 3 L18 9 L12 21 Z" fill="#7DDDFF"/></svg>
          <span class="pe-cost-num" style="font-size:15px;">5</span>
          <span class="pe-cost-lbl">Tapies</span>
        </span>
        <span class="pe-trigger" style="width:36px; height:36px;">
          <svg class="pe-rocket" style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none">
            <path d="M9 5 L13 1 L17 5 L17 14 L9 14 Z" fill="white"/>
            <path d="M9 9 L5 14 L9 14 Z" fill="rgba(125,221,255,0.7)"/>
            <path d="M17 9 L21 14 L17 14 Z" fill="rgba(125,221,255,0.7)"/>
          </svg>
        </span>
      </div>
    </div>
    <div class="compare-item">
      <span class="compare-label">新版 (32px)</span>
      <div class="pe-launcher">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/>
            <path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/>
          </svg>
          <span class="pe-cost-num">5</span>
          <span class="pe-cost-lbl">T</span>
        </span>
        <span class="pe-trigger">
          <svg class="pe-rocket" viewBox="0 0 24 24" fill="none">
            <path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.9)"/>
            <path d="M8 9 L4 14 L8 14 Z" fill="rgba(125,221,255,0.8)"/>
            <path d="M16 9 L20 14 L16 14 Z" fill="rgba(125,221,255,0.8)"/>
            <path d="M10 14 L12 17 L14 14 Z" fill="rgba(255,200,100,0.9)"/>
          </svg>
        </span>
      </div>
    </div>
  </div>

  <div class="section">状态变体</div>
  <div class="stage" style="margin-bottom: 20px;">
    <div class="stage-cell">
      <span class="stage-label">DEFAULT</span>
      <div class="pe-launcher">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/><path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/></svg>
          <span class="pe-cost-num">5</span>
          <span class="pe-cost-lbl">T</span>
        </span>
        <span class="pe-trigger">
          <svg class="pe-rocket" viewBox="0 0 24 24" fill="none"><path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.9)"/><path d="M8 9 L4 14 L8 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M16 9 L20 14 L16 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M10 14 L12 17 L14 14 Z" fill="rgba(255,200,100,0.9)"/></svg>
        </span>
      </div>
    </div>
    <div class="stage-cell">
      <span class="stage-label">HOVER</span>
      <div class="pe-launcher" style="transform: translateY(-1px);">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/><path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/></svg>
          <span class="pe-cost-num">5</span>
          <span class="pe-cost-lbl">T</span>
        </span>
        <span class="pe-trigger" style="transform: scale(1.08);">
          <svg class="pe-rocket" viewBox="0 0 24 24" fill="none"><path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.9)"/><path d="M8 9 L4 14 L8 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M16 9 L20 14 L16 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M10 14 L12 17 L14 14 Z" fill="rgba(255,200,100,0.9)"/></svg>
        </span>
      </div>
    </div>
    <div class="stage-cell">
      <span class="stage-label">DISABLED</span>
      <div class="pe-launcher disabled">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/><path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/></svg>
          <span class="pe-cost-num">5</span>
          <span class="pe-cost-lbl">T</span>
        </span>
        <span class="pe-trigger">
          <svg class="pe-rocket" viewBox="0 0 24 24" fill="none"><path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.5)"/><path d="M8 9 L4 14 L8 14 Z" fill="rgba(100,100,100,0.5)"/><path d="M16 9 L20 14 L16 14 Z" fill="rgba(100,100,100,0.5)"/></svg>
        </span>
      </div>
    </div>
    <div class="stage-cell">
      <span class="stage-label">SUBMITTING</span>
      <div class="pe-launcher submitting">
        <span class="pe-cost">
          <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/><path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/></svg>
          <span class="pe-cost-num">5</span>
          <span class="pe-cost-lbl">T</span>
        </span>
        <span class="pe-trigger">
          <svg class="pe-rocket" viewBox="0 0 24 24" fill="none"><path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.9)"/><path d="M8 9 L4 14 L8 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M16 9 L20 14 L16 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M10 14 L12 17 L14 14 Z" fill="rgba(255,200,100,0.9)"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div class="section">与系统元素对比</div>
  <div class="stage">
    <div style="font-size: 12px; color: rgba(255,255,255,0.5);">
      节点输入框高度约 40px，新按钮 32px 高度，比例协调
    </div>
    <div class="pe-launcher" style="margin-top: 8px;">
      <span class="pe-cost">
        <svg class="pe-cost-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 9 L22 12 L15 15 L12 22 L9 15 L2 12 L9 9 Z" fill="#7DDDFF" opacity="0.9"/><path d="M12 6 L14 10 L18 12 L14 14 L12 18 L10 14 L6 12 L10 10 Z" fill="rgba(255,255,255,0.5)"/></svg>
        <span class="pe-cost-num">5</span>
        <span class="pe-cost-lbl">T</span>
      </span>
      <span class="pe-trigger">
        <svg class="pe-rocket" viewBox="0 0 24 24" fill="none"><path d="M8 6 L12 2 L16 6 L16 14 L8 14 Z" fill="rgba(255,255,255,0.9)"/><path d="M8 9 L4 14 L8 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M16 9 L20 14 L16 14 Z" fill="rgba(125,221,255,0.8)"/><path d="M10 14 L12 17 L14 14 Z" fill="rgba(255,200,100,0.9)"/></svg>
      </span>
    </div>
  </div>
</div>
</body>
</html>
